<div class="d-flex align-items-center justify-content-between list-reservation-header">
  <div class="fs-1">
    <h2>Reservations - {{ les_reservations.length }}</h2>
  </div>
  <div class="d-flex">
    <button class="btn btn-primary" (click)="openModal_add_reservation()">
      <i class="bi bi-plus-circle-dotted"></i>
      Réservation
    </button>
  </div>
</div>

<div class="row g-3 mt-4">
  <div class="col-lg-8">
    <div class="calendar-wrapper shadow-sm rounded bg-white p-2">
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  </div>
<div class="col-lg-4">
  <div class="reservation-list shadow-sm rounded bg-white p-3 h-100 overflow-auto">
    <h6 class="fw-bold border-bottom pb-2 mb-3 text-muted">Liste des réservations</h6>
    <div *ngIf="les_reservations.length === 0" class="text-muted small text-center mt-4">
      Aucune réservation trouvée.
    </div>

    <div class="reservation-list-scroll-area">
      <div *ngFor="let r of les_reservations" class="reservation-item"> <div class="d-flex justify-content-between align-items-center mb-1">
          <div class="fw-semibold text-primary">{{ r.libelle_reservation }}</div> <div class="reservation-actions"> <button class="btn btn-sm btn-outline-primary rounded-circle me-1" (click)="openModal_edit_reservation(r)" title="Modifier">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger rounded-circle" (click)="delete_reservation(r)" title="Supprimer">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
        <div class="small text-muted reservation-details">
            <i class="bi bi-calendar"></i> {{ r.date | date: 'mediumDate' }}
            <i class="bi bi-clock ms-2"></i> {{ r.heure_debut }} &rarr; {{ r.heure_fin }}
        </div>
      </div>
    </div>
  </div>
</div>
</div>
