<div class="d-flex align-items-center justify-content-between">
  <div class="fs-1">
    <h2>Reservations - {{ les_reservations.length }}</h2>
  </div>
  <div class="d-flex">
    <button class="btn btn-primary" (click)="openModal_add_reservation()">
      <i class="bi bi-plus-circle-dotted"></i>
     Réservation
    </button>
  </div>
</div>

<div class="row g-3 mt-4">
  <!-- Calendrier -->
  <div class="col-lg-8">
    <div class="calendar-wrapper shadow-sm rounded bg-white p-2">
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  </div>

  <!-- Liste des réservations -->
  <div class="col-lg-4">
    <div class="reservation-list shadow-sm rounded bg-white p-3 h-100 overflow-auto">
      <h6 class="fw-bold border-bottom pb-2 mb-3 text-muted">Liste des réservations</h6>
      <div *ngIf="les_reservations.length === 0" class="text-muted small">Aucune réservation trouvée</div>

      <div *ngFor="let r of les_reservations" class="reservation-item border-bottom pb-2 mb-2">
        <div class="fw-semibold">{{ r.libelle_reservation }}</div>
        <div class="small text-muted">{{ r.date }} | {{ r.heure_debut }} → {{ r.heure_fin }}</div>
        <div class="d-flex justify-content-end gap-2 mt-2">
          <button class="btn btn-sm btn-outline-primary" (click)="openModal_edit_reservation(r)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="delete_reservation(r)">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
